name: Build

# Every run (manual or scheduled) compiles the app and packages the
# Portable|x64 output into a single installer .exe (packaging/weekly-build.iss),
# uploaded as a downloadable run artifact on that run's summary page. The
# Monday schedule additionally publishes the same installer under the
# evergreen "weekly-build" tag and sets it as the repo's Latest release, so
# it gets visibility/traction -- it still never touches the tagged v*
# release assets themselves, just which one GitHub shows as Latest.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 8 * * 1' # every Monday, 08:00 UTC, regardless of what changed

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore "HC Player.slnx"

      - name: Build (Portable|x64, self-contained)
        shell: pwsh
        run: msbuild "HC Player.slnx" /t:Rebuild /p:Configuration=Portable /p:Platform=x64 /m /v:minimal

      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter "HC Player.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) {
            Write-Error "Build did not produce HC Player.exe anywhere under the repo."
            Write-Host "All .exe files found:"
            Get-ChildItem -Path . -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Build OK: $($exe.FullName)"
          "exe_dir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (single .exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DSourceDir="${{ steps.locate.outputs.exe_dir }}" /DAppVersion="0.0.0-${{ github.run_number }}" /O"${{ github.workspace }}" packaging\weekly-build.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer output
        shell: pwsh
        run: |
          if (-not (Test-Path "HC-Player-Setup.exe")) {
            Write-Error "Installer was not produced."
            exit 1
          }
          Write-Host "Installer OK: HC-Player-Setup.exe"

      - name: Upload installer as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: HC-Player-Setup
          path: HC-Player-Setup.exe
          retention-days: 14

      - name: Publish weekly dev build
        if: github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weekly-build
          name: "Weekly dev build (auto)"
          prerelease: false
          make_latest: "true"
          body: |
            Fresh automated build from `main` @ ${{ github.sha }}, packaged
            every Monday.

            This build isn't code-signed, so Windows SmartScreen may show an
            "unknown publisher" prompt the first time you run the installer --
            click **More info** -> **Run anyway** to continue.

            Bundled `libmpv-2.dll` matches the revisions pinned in
            `HC Player/SOURCE-MANIFEST.md`.
          files: HC-Player-Setup.exe
